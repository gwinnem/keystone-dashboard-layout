name: Mutation testing

# Deliberately NOT run on every push/PR — mutation testing re-runs the test
# suite once per mutant, far too slow for per-PR feedback. Runs weekly
# instead, plus on-demand via workflow_dispatch. Scoped to packages/vue
# (the only package with a Stryker config today) — see
# packages/vue/docs/STRYKER.md for the full rationale and how to run it
# locally. Add a matching step per package once react/angular have real
# test suites and their own stryker.conf.json.
on:
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  mutation-test-vue:
    name: Stryker mutation testing (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        run: pnpm --filter @keystone-dashboard-layout/vue run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/vue/reports/mutation/
          retention-days: 30
