name: Mutation testing

# Deliberately NOT run on every push/PR — mutation testing re-runs the test
# suite once per mutant, far too slow for per-PR feedback. Runs weekly
# instead, plus on-demand via workflow_dispatch.
#
# All four packages are now confirmed working via real local runs:
#   - react: 82.93% overall mutation score (up from an earlier 79.42%
#     snapshot), after fixing a real, confirmed bug: this package's own
#     vitest.config.ts uses a '@/core' path alias reaching into the
#     sibling packages/core/src, but Stryker's default sandboxing only
#     copies this package's own directory into its temp sandbox — fixed
#     via an explicit `files` option in packages/react/stryker.conf.json
#     adding that sibling path (see that config's own
#     '_comment_resolved_limitation' for the full account).
#   - vue: 82.08% overall mutation score (up from an earlier 65.53%
#     snapshot), real kill/survive/timeout numbers across every
#     composable. The same '@/core'-reaching-outside-the-sandbox problem
#     applied here too, but needed a different fix (React's own
#     `files`-option workaround doesn't generalize) — Stryker is invoked
#     from the MONOREPO ROOT instead (see packages/vue/package.json's own
#     `test:mutation` script), which surfaced three further follow-on
#     issues along the way. See packages/vue/docs/STRYKER.md's own "Why
#     the monorepo root" section for the full account of all four, and
#     packages/vue/stryker.conf.json's own '_comment_known_limitation'
#     for the short version.
#   - core: 85.71% overall mutation score. The simplest setup of the
#     four: this package's own '@/core' alias is self-referential
#     (resolves to its own src/, not a sibling package), so it never had
#     the cross-package sandboxing problem the other three needed
#     workarounds for. See packages/core/docs/STRYKER-KNOWN-ISSUES.md for
#     a documented, unresolved case of specific mutants surviving despite
#     100%-confirmed real test coverage — not yet root-caused, don't
#     assume more tests alone will fix it if picking this up again.
#   - angular: 81.14% overall mutation score (up from an earlier 71.47%
#     snapshot, confirmed via a real run completing cleanly with zero
#     dry-run failures), after two real fixes, both confirmed (not just
#     reasoned through): (1) an explicit `testEnvironment: 'jsdom'` in
#     jest.config.ts, since @stryker-mutator/jest-runner's own sandbox
#     resolved jest-preset-angular's implicit default differently than
#     plain `jest` does, previously surfacing as 'ReferenceError: document
#     is not defined' plus an Angular DI circular-dependency cascade; (2) a
#     genuine source bug this then surfaced — grid-layout.component.ts's
#     own `hasInitializedUndoTracking` flag, guarding against a false
#     '0 -> N items' transition on first population being misread as a
#     user-driven undo-worthy change. See packages/angular/stryker.conf.json's
#     own '_comment_resolved_limitation' for the full account of both.
#     Every individual file now sits above 80% (cross-grid-registry.ts and
#     grid-layout.component.ts, the two lowest scorers at the 71.47%
#     snapshot, are now at 90.63% and 80.23% respectively) — this job has
#     only been confirmed via local runs so far, not yet re-verified as
#     green in a real, live CI run specifically — and, as of this same
#     writing, couldn't have been: every job in this workflow (and in
#     ci.yml/release.yml) was failing immediately at "Setup pnpm" with
#     "Multiple versions of pnpm specified" (version '9' hardcoded here
#     vs. root package.json's own packageManager: pnpm@11.22.0) — fixed
#     by removing the hardcoded version and letting pnpm/action-setup@v4
#     auto-detect from package.json instead, the same fix applied to all
#     three workflow files.
on:
  schedule:
    - cron: '0 3 * * 1' # every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  mutation-test-react:
    name: Stryker mutation testing (React)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        run: pnpm --filter @keystone-dashboard-layout/react run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-react
          path: packages/react/reports/mutation/
          retention-days: 30

  mutation-test-vue:
    name: Stryker mutation testing (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This package's own `test:mutation` script itself `cd`s to the
      # monorepo root before invoking Stryker (see the top-of-file comment
      # above, and packages/vue/docs/STRYKER.md) — `pnpm --filter` here
      # only sets the initial working directory the script starts from,
      # matching how mutation-test-react above invokes its own script.
      - name: Run Stryker
        run: pnpm --filter @keystone-dashboard-layout/vue run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-vue
          path: packages/vue/reports/mutation/
          retention-days: 30

  mutation-test-core:
    name: Stryker mutation testing (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        run: pnpm --filter @keystone-dashboard-layout/core run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-core
          path: packages/core/reports/mutation/
          retention-days: 30

  mutation-test-angular:
    name: Stryker mutation testing (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        run: pnpm --filter @keystone-dashboard-layout/angular run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-angular
          path: packages/angular/reports/mutation/
          retention-days: 30
