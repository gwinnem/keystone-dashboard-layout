name: Release

# Runs on every push to main. semantic-release inspects conventional commit
# messages since the last release to decide whether a release is warranted
# and what version bump it implies — most pushes (docs, chores) result in
# no release, which is expected.
#
# Only packages/vue publishes today (it's the only package with a
# .releaserc.json and real implementation). Once packages/react and
# packages/angular have real code ready to publish, give each its own
# .releaserc.json and add a matching job below — at that point, switch to
# https://github.com/semantic-release/semantic-release/blob/master/docs/recipes/release-workflow/monorepo.md
# or a plugin like `semantic-release-monorepo` so each package's release
# is scoped to commits touching its own path.
#
# REQUIRES an `NPM_TOKEN` repository secret (an npm automation token with
# publish rights) before this can actually publish. Until that secret is
# added, the "Release" step fails safely (no partial/destructive action).
# GITHUB_TOKEN is provided automatically by Actions.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-vue:
    name: Release @keystone-dashboard-layout/vue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release needs full commit history to determine the
          # next version from conventional commits, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @keystone-dashboard-layout/vue run typecheck

      - name: Test (with coverage gate)
        run: pnpm --filter @keystone-dashboard-layout/vue run test:coverage

      - name: Build library
        run: pnpm --filter @keystone-dashboard-layout/vue run build

      - name: Check bundle size
        run: pnpm --filter @keystone-dashboard-layout/vue run check:bundle-size

      - name: Release
        working-directory: packages/vue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
