name: Release

# Manual only (workflow_dispatch): publishing to npm is done by hand, not on every push to main.
#
# Versions and changelogs are handled by Changesets, in two separate steps:
#
#   1. LOCALLY, before this workflow: `pnpm changeset` (run from a package directory) records each change as a small file
#      in .changeset/. When you want a release, run `pnpm version-packages` from the repo root: it consumes those files,
#      bumps each affected package's version and writes its CHANGELOG.md. Commit and push the result to main.
#   2. THIS WORKFLOW: checks that everything is green, then runs `changeset publish`, which publishes every package whose
#      current version is not on npm yet (core before the packages that depend on it, and nothing twice, so a re-run after
#      a partial failure is safe), then pushes the git tags it created.
#
# The workflow refuses to run while .changeset/ still holds unconsumed changesets: that means step 1 was skipped, and
# publishing would release versions without the changes that were meant to go with them.
#
# Replaced semantic-release, which derived each version from conventional commit messages. Commit messages no longer
# decide anything about releases.
#
# REQUIRES an `NPM_TOKEN` repository secret (an npm automation token with publish rights). Until it is added, the publish
# step fails without publishing anything. GITHUB_TOKEN is provided automatically by Actions and is what pushes the tags.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          # Writes an .npmrc that reads the token from NODE_AUTH_TOKEN, set on the publish step below.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse to release with unconsumed changesets
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null || true)
          if [ -n "$pending" ]; then
            echo "::error::Unconsumed changesets found. Run 'pnpm version-packages' locally, commit the result and push before releasing."
            echo "$pending"
            exit 1
          fi

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Build all packages
        run: pnpm build

      - name: Check bundle size (Vue package)
        run: pnpm --filter keystone-dashboard-layout-vue run check:bundle-size

      - name: Check bundle size (React package)
        # continue-on-error until verified against a real build; see packages/react/scripts/check-bundle-size.js's own top comment.
        run: pnpm --filter keystone-dashboard-layout-react run check:bundle-size
        continue-on-error: true

      - name: Check bundle size (Angular package)
        # continue-on-error until verified against a real build; see packages/angular/scripts/check-bundle-size.js's own top comment.
        run: pnpm --filter keystone-dashboard-layout-angular run check:bundle-size
        continue-on-error: true

      - name: Configure git identity
        # `changeset publish` creates the release tags, which needs a committer identity.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to npm
        run: pnpm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        run: git push origin --tags
