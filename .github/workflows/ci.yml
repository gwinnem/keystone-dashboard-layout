name: CI

# Runs on every push to main and every PR. Monorepo-aware: turbo runs each
# task (typecheck, lint, test, build, ...) per package, automatically
# skipping any package whose package.json doesn't define that script (e.g.
# packages/react and packages/angular are scaffolds and don't yet define
# every task packages/vue does).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_DEFAULT: '20'
  PNPM_VERSION: '9'

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Root package.json's engines field is "^18.0.0 || ^20.0.0 || >=22.0.0"
        # — test against the full supported range.
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Lint styles — clean, blocking (packages that define lint:style)
        run: pnpm lint:style

      - name: Lint — advisory, not yet blocking
        # packages/vue carries ~800 pre-existing issues from before it had a
        # working ESLint config at all (see packages/vue/docs/REFACTORING.md
        # #6). Runs so the count is visible on every PR without failing
        # builds on debt nobody's asked this PR to pay down. Flip to a hard
        # gate once that cleanup lands.
        run: pnpm lint
        continue-on-error: true

      - name: Unit + component tests (with coverage gate)
        # packages/vue enforces a 90% coverage floor via its own
        # vitest.config.js; packages/react passes trivially
        # (passWithNoTests) until real tests exist.
        run: pnpm test:coverage

      - name: Build all packages
        run: pnpm build

      - name: Check bundle size (Vue package)
        run: pnpm --filter @keystone-dashboard-layout/vue run check:bundle-size

      - name: Verify the published Vue package actually installs and resolves
        # Packs the tarball and installs it into a genuinely separate
        # scratch directory, asserting every `exports` subpath resolves —
        # catches issues that testing through source aliases never would.
        run: pnpm --filter @keystone-dashboard-layout/vue run check:package-install

      - name: Build Vue demo app
        run: pnpm --filter @keystone-dashboard-layout/vue run demo:build

      - name: Build documentation site
        run: pnpm docs:build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Only packages/vue defines playwright.config.ts today; this
        # installs browsers once for whichever packages need them.
        run: pnpm --filter @keystone-dashboard-layout/vue exec playwright install --with-deps

      - name: Run e2e tests
        # turbo skips any package without a test:e2e script (currently only
        # packages/vue defines one).
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/*/playwright-report/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=high

      - name: Audit all dependencies (advisory)
        # vitepress vendors its own vite a major version behind the
        # workspace's top-level vite, with no non-breaking fix available
        # yet — dev-server-only, doesn't affect published consumers.
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check production dependency licenses (blocking)
        # Fails if any production (or transitive) dependency is under a
        # license outside the allowlist — mainly catches copyleft licenses,
        # which would impose obligations on every consumer of a published
        # package.
        run: pnpm run check:licenses
