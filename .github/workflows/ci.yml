name: CI

# Runs on every push to main and every PR. Monorepo-aware: turbo runs each
# task (typecheck, lint, test, build, ...) per package, automatically
# skipping any package whose package.json doesn't define that script.
# packages/vue, packages/react, and packages/angular all have full feature
# parity and real test suites today; each still defines a slightly
# different task set (e.g. Angular deliberately omits dev/lint/test:e2e —
# see that package's own package.json _comment_scripts field for why),
# which is exactly what turbo's own skip-if-undefined behavior is for.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_DEFAULT: '22'
  # No PNPM_VERSION here on purpose — pnpm/action-setup@v4 auto-detects
  # the version from this repo's own root package.json "packageManager"
  # field when no explicit version is passed. Pinning both here and in
  # package.json is what caused every job in this workflow to fail
  # immediately ("Multiple versions of pnpm specified") once package.json
  # was bumped to pnpm@11.22.0 without this file being updated to match —
  # letting this auto-detect means a future pnpm bump only ever needs to
  # touch package.json.

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Root package.json's own engines field is ">=22.0.0" — Node 18
        # reached its own end-of-life in April 2025, and Node 20 reached
        # its own end-of-life in April 2026 (confirmed directly, not
        # assumed); testing either any further was already questionable
        # on that basis alone. It's also no longer just a policy
        # preference: packages/core's own `vite build` depends on
        # rolldown, which imports `node:util`'s `styleText` export — an
        # API Node 18 never had at all, confirmed via a real, reproduced
        # CI failure (`SyntaxError: The requested module 'node:util' does
        # not provide an export named 'styleText'`) — so Node 18 could
        # not build this project's own tooling even if its own EOL status
        # were set aside entirely. Node 22 is the one version in the old
        # three-way matrix that's both still actively supported and
        # confirmed able to build/typecheck/test every package for real.
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Lint styles — clean, blocking (packages that define lint:style)
        run: pnpm lint:style

      - name: Lint — advisory, not yet blocking
        # packages/vue carries ~800 pre-existing issues from before it had a
        # working ESLint config at all (see packages/vue/docs/REFACTORING.md
        # #6). Runs so the count is visible on every PR without failing
        # builds on debt nobody's asked this PR to pay down. Flip to a hard
        # gate once that cleanup lands.
        run: pnpm lint
        continue-on-error: true

      - name: Unit + component tests (with coverage gate)
        # packages/vue enforces a 90% coverage floor via its own
        # vitest.config.js; packages/react and packages/angular each have
        # their own real, extensive test suites now too (Vitest and Jest
        # respectively) — no longer a passWithNoTests placeholder.
        run: pnpm test:coverage

      - name: Build all packages
        run: pnpm build

      - name: Check bundle size (Vue package)
        run: pnpm --filter @keystone-dashboard-layout/vue run check:bundle-size

      - name: Verify the published Vue package actually installs and resolves
        # Packs the tarball and installs it into a genuinely separate
        # scratch directory, asserting every `exports` subpath resolves —
        # catches issues that testing through source aliases never would.
        run: pnpm --filter @keystone-dashboard-layout/vue run check:package-install

      - name: Check bundle size (React package)
        # continue-on-error until verified against a real build — this
        # script (like Angular's own below) has never actually been run;
        # see its own top comment for what's unverified about it. Remove
        # continue-on-error once confirmed working, so a real regression
        # actually blocks CI the way Vue's own check does.
        run: pnpm --filter @keystone-dashboard-layout/react run check:bundle-size
        continue-on-error: true

      - name: Verify the published React package actually installs and resolves
        run: pnpm --filter @keystone-dashboard-layout/react run check:package-install
        continue-on-error: true

      - name: Check bundle size (Angular package)
        # continue-on-error until verified — this script's own
        # "measure the whole output directory" approach and its BUDGET_KB
        # placeholder are both unverified against a real ng-packagr build;
        # see its own top comment.
        run: pnpm --filter @keystone-dashboard-layout/angular run check:bundle-size
        continue-on-error: true

      - name: Verify the published Angular package actually installs and resolves
        # continue-on-error until verified — this script's own assumptions
        # about ng-packagr's generated package.json/exports shape haven't
        # been checked against a real build; see its own top comment.
        run: pnpm --filter @keystone-dashboard-layout/angular run check:package-install
        continue-on-error: true

      - name: Build Vue demo app
        run: pnpm --filter @keystone-dashboard-layout/vue run demo:build

      - name: Install documentation site dependencies
        # astro-docs is a separate, standalone project (its own
        # package.json/pnpm-workspace.yaml, deliberately outside this
        # root workspace) that depends on the just-built packages above
        # via `link:../packages/*` — install its own dependencies
        # explicitly rather than assuming the root `pnpm install` above
        # covered it, since it doesn't.
        working-directory: astro-docs
        run: pnpm install

      - name: Build documentation site
        working-directory: astro-docs
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # packages/vue and packages/react both define playwright.config.ts
        # today (packages/angular deliberately has no e2e layer yet — see
        # that package's own SUPPORT.md). This installs browsers once for
        # whichever packages need them.
        run: pnpm --filter @keystone-dashboard-layout/vue exec playwright install --with-deps

      - name: Run e2e tests
        # turbo skips any package without a test:e2e script (packages/vue
        # and packages/react both define one; packages/angular
        # deliberately doesn't yet — see that package's own SUPPORT.md).
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/*/playwright-report/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=high

      - name: Audit all dependencies (advisory)
        # Broader dev-dependency audit than the production-only gate
        # above — kept advisory rather than blocking, since a dev-only
        # transitive advisory shouldn't fail CI the way a production one
        # should; doesn't affect published consumers either way.
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check production dependency licenses (blocking)
        # Fails if any production (or transitive) dependency is under a
        # license outside the allowlist — mainly catches copyleft licenses,
        # which would impose obligations on every consumer of a published
        # package.
        run: pnpm run check:licenses
