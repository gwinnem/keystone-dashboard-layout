<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 462" width="500" height="462" role="img" aria-label="A mockup dashboard: revenue, active users, signups, top regions, and conversion panels, with a churn rate panel being dragged into a new position">
  <defs>
    <pattern id="kdl-grid-lines" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#2a323d" stroke-width="1" opacity="0.7"/>
    </pattern>
    <filter id="kdl-drop-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- stage background -->
  <rect x="0" y="0" width="500" height="462" rx="14" fill="#1a1f26" stroke="#2a323d"/>
  <rect x="1" y="1" width="498" height="460" rx="13" fill="url(#kdl-grid-lines)"/>

  <!-- g-1: revenue -->
  <g>
    <rect x="24" y="24" width="150" height="118" rx="9" fill="#212831" stroke="#2a323d"/>
    <text x="38" y="48" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#9aa4b2">revenue</text>
    <g transform="translate(38, 60)">
      <rect x="0" y="20" width="15" height="24" rx="3" fill="#4FB8C9" opacity="0.85"/>
      <rect x="24" y="15" width="15" height="29" rx="3" fill="#4FB8C9" opacity="0.85"/>
      <rect x="48" y="24" width="15" height="20" rx="3" fill="#4FB8C9" opacity="0.85"/>
      <rect x="72" y="6" width="15" height="38" rx="3" fill="#F2A93B" opacity="0.95"/>
      <rect x="96" y="18" width="15" height="26" rx="3" fill="#4FB8C9" opacity="0.85"/>
    </g>
  </g>

  <!-- g-2: active users -->
  <g>
    <rect x="190" y="24" width="150" height="118" rx="9" fill="#212831" stroke="#2a323d"/>
    <text x="204" y="48" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#9aa4b2">active users</text>
    <g transform="translate(204, 58)">
      <polyline points="0,42 22,32 44,37 66,18 88,24 122,5" fill="none" stroke="#4FB8C9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="122" cy="5" r="3.5" fill="#F2A93B"/>
    </g>
  </g>

  <!-- g-3: signups -->
  <g>
    <rect x="356" y="24" width="112" height="118" rx="9" fill="#212831" stroke="#2a323d"/>
    <text x="370" y="48" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#9aa4b2">signups</text>
    <rect x="370" y="60" width="65" height="5" rx="2.5" fill="#ffffff" opacity="0.10"/>
    <rect x="370" y="72" width="37" height="5" rx="2.5" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- g-4: top regions -->
  <g>
    <rect x="24" y="158" width="150" height="150" rx="9" fill="#212831" stroke="#2a323d"/>
    <text x="38" y="182" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#9aa4b2">top regions</text>
    <g font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="10">
      <line x1="38" y1="199" x2="160" y2="199" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="38" y="196" fill="#ffffff" fill-opacity="0.5">US</text>
      <text x="160" y="196" text-anchor="end" fill="#ffffff" fill-opacity="0.82">42%</text>
      <line x1="38" y1="220" x2="160" y2="220" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="38" y="217" fill="#ffffff" fill-opacity="0.5">EU</text>
      <text x="160" y="217" text-anchor="end" fill="#ffffff" fill-opacity="0.82">31%</text>
      <line x1="38" y1="241" x2="160" y2="241" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="38" y="238" fill="#ffffff" fill-opacity="0.5">APAC</text>
      <text x="160" y="238" text-anchor="end" fill="#ffffff" fill-opacity="0.82">18%</text>
    </g>
  </g>

  <!-- g-5: conversion -->
  <g>
    <rect x="190" y="158" width="150" height="98" rx="9" fill="#212831" stroke="#2a323d"/>
    <text x="204" y="182" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#9aa4b2">conversion</text>
    <rect x="204" y="194" width="55" height="5" rx="2.5" fill="#ffffff" opacity="0.10"/>
    <rect x="204" y="206" width="75" height="5" rx="2.5" fill="#ffffff" opacity="0.10"/>
  </g>

  <!-- ghost: dashed placeholder left behind by the dragged item -->
  <rect x="190" y="266" width="150" height="98" rx="9" fill="#F2A93B" fill-opacity="0.04" stroke="#F2A93B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- coord tag -->
  <g font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" fill="#F2A93B">
    <rect x="24" y="286" width="141" height="24" rx="6" fill="#14171a" stroke="#c97f1f"/>
    <path d="M32 298h8M37 294l4 4-4 4" fill="none" stroke="#F2A93B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="302">x:2 y:4 → x:1 y:6</text>
  </g>

  <!-- g-dragged: churn rate, lifted out with rotation + shadow -->
  <g transform="rotate(-3, 325, 391)" filter="url(#kdl-drop-shadow)">
    <rect x="250" y="342" width="150" height="98" rx="9" fill="#F5F4EF" stroke="#F2A93B" stroke-width="1.5"/>
    <text x="264" y="366" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#c97f1f">churn rate</text>
    <g transform="translate(264, 378)">
      <rect x="0" y="14" width="15" height="22" rx="3" fill="#c97f1f" opacity="0.8"/>
      <rect x="24" y="20" width="15" height="16" rx="3" fill="#c97f1f" opacity="0.8"/>
      <rect x="48" y="8" width="15" height="28" rx="3" fill="#c97f1f" opacity="0.8"/>
      <rect x="72" y="24" width="15" height="12" rx="3" fill="#c97f1f" opacity="0.8"/>
    </g>
  </g>
</svg>
